<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">EAR — three ways to keep research moving</title>
  <desc id="desc">Three independent workflows: AutoVibeIdea develops research proposals, AutonomousMath investigates and revises mathematical manuscripts, and AutoRebuttal organizes evidence and responses. Researchers set goals and check the results. Saved artifacts preserve the work behind each decision.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .ink { fill: #14283f; } .muted { fill: #596b80; } .teal { fill: #147d83; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
      .name { font-size: 27px; font-weight: 700; } .body { font-size: 17px; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
  <text x="46" y="48" class="label teal">EFFECTIVE AUTO RESEARCH</text>
  <text x="46" y="102" class="ink" font-size="42" font-weight="750">Keep research moving.</text>
  <text x="46" y="138" class="body muted">Set the direction. Inspect the evidence. Decide what comes next.</text>

  <g transform="translate(46 182)">
    <rect width="354" height="232" rx="14" fill="#fff" stroke="#d7e3e9"/>
    <rect width="354" height="6" rx="3" fill="#147d83"/>
    <text x="24" y="42" class="label teal">01 / FIND A DIRECTION</text>
    <text x="24" y="85" class="name ink">AutoVibeIdea</text>
    <text x="24" y="119" class="body muted">Search · Critique · Refine</text>
    <path d="M24 145 H330" stroke="#e4ecef"/>
    <text x="24" y="177" class="body ink">Literature + ranked candidates</text>
    <text x="24" y="204" class="body ink">A grounded research proposal</text>
  </g>
  <g transform="translate(423 182)">
    <rect width="354" height="232" rx="14" fill="#14283f"/>
    <rect width="354" height="6" rx="3" fill="#57c2bb"/>
    <text x="24" y="42" class="label" fill="#82d8d0">02 / DEVELOP A RESULT</text>
    <text x="24" y="85" class="name" fill="#fff">AutonomousMath</text>
    <text x="24" y="119" class="body" fill="#c2d4e1">Investigate · Review · Revise</text>
    <path d="M24 145 H330" stroke="#3b5066"/>
    <text x="24" y="177" class="body" fill="#fff">Proofs + mathematical manuscript</text>
    <text x="24" y="204" class="body" fill="#fff">Feedback to improve the next attempt</text>
  </g>
  <g transform="translate(800 182)">
    <rect width="354" height="232" rx="14" fill="#fff" stroke="#d7e3e9"/>
    <rect width="354" height="6" rx="3" fill="#d6a24b"/>
    <text x="24" y="42" class="label" fill="#936718">03 / ANSWER REVIEWS</text>
    <text x="24" y="85" class="name ink">AutoRebuttal</text>
    <text x="24" y="119" class="body muted">Map concerns · Check · Revise</text>
    <path d="M24 145 H330" stroke="#e4ecef"/>
    <text x="24" y="177" class="body ink">Evidence map + response drafts</text>
    <text x="24" y="204" class="body ink">A clear record of unresolved issues</text>
  </g>
  <circle cx="54" cy="462" r="5" fill="#147d83"/>
  <text x="70" y="468" class="body ink">Three independent entry points. Saved artifacts carry the work forward.</text>
  <text x="46" y="495" class="muted" font-size="14">Researchers retain judgments about value, correctness, and final claims.</text>
</svg>
