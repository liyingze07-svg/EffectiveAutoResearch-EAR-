<svg xmlns="http://www.w3.org/2000/svg" class="ear-architecture" viewBox="0 0 1180 425" role="img" aria-label="AutoRebuttal：诊断关切、补齐证据与核查回复"><title>AutoRebuttal：诊断关切、补齐证据与核查回复</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#574176"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#20786c"/></marker></defs><style>.ear-architecture text{font-family:Arial,"PingFang SC",sans-serif;fill:#292438}.ear-architecture .small{font-size:17px;fill:#777080}.ear-architecture .label{font-size:19px;font-weight:600}.ear-architecture .heading{font-size:22px;font-weight:600}.ear-architecture .note{font-size:18px;fill:#20786c}</style><rect x="20" y="20" width="1140" height="385" rx="7" fill="#faf8fc" stroke="#cfc6d9" stroke-width="1.5"/><text x="40" y="52" class="heading" text-anchor="start">AutoRebuttal · 先解决证据，再组织回应</text><rect x="44" y="105" width="180" height="80" rx="5" fill="#f0e9fa" stroke="#b1a5bf" stroke-width="1.5"/><text x="134.0" y="140.0" class="label" text-anchor="middle">论文与评审</text><text x="134.0" y="169.0" class="small" text-anchor="middle">已有证据</text><rect x="266" y="105" width="200" height="80" rx="5" fill="#fff" stroke="#b1a5bf" stroke-width="1.5"/><text x="366.0" y="140.0" class="label" text-anchor="middle">映射与诊断</text><text x="366.0" y="169.0" class="small" text-anchor="middle">B1 · 关切覆盖</text><rect x="505" y="105" width="206" height="80" rx="5" fill="#f7f1e8" stroke="#b9a58b" stroke-width="1.5"/><text x="608.0" y="140.0" class="label" text-anchor="middle">补齐技术缺口</text><text x="608.0" y="169.0" class="small" text-anchor="middle">证明 / 实验</text><rect x="750" y="105" width="189" height="80" rx="5" fill="#fff" stroke="#b1a5bf" stroke-width="1.5"/><text x="844.5" y="140.0" class="label" text-anchor="middle">草稿与共识</text><text x="844.5" y="169.0" class="small" text-anchor="middle">r7 · 内容门控</text><rect x="978" y="105" width="160" height="80" rx="5" fill="#e8f4ef" stroke="#6aa091" stroke-width="1.5"/><text x="1058.0" y="140.0" class="label" text-anchor="middle">作者材料包</text><text x="1058.0" y="169.0" class="small" text-anchor="middle">回应 + 证据账本</text><path d="M224 145H266" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><path d="M466 145H505" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><path d="M711 145H750" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 105V80H845V105" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="71" class="small" text-anchor="middle">证据充分：直接起草</text><path d="M608 185V218H517V185" fill="none" stroke="#20786c" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 5"/><text x="607" y="244" class="small" text-anchor="middle">S-ante / S-exp：设计与结果检查</text><rect x="680" y="285" width="293" height="60" rx="5" fill="#e8f4ef" stroke="#6aa091" stroke-width="1.5"/><text x="826.5" y="322.0" class="label" text-anchor="middle">B2 · 忠实性 / B3 · 漏洞检查</text><path d="M845 185V285" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><path d="M973 315H1058V185" fill="none" stroke="#574176" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 315H361V185" fill="none" stroke="#20786c" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 5"/><text x="518" y="341" class="note" text-anchor="middle">返回修订或保留未解决事项</text><text x="590" y="386" class="small" text-anchor="middle">最终技术结论与回复交由作者核查</text></svg>